# ═══════════════════════════════════════════════════════════
# CrisisLens — Render Infrastructure as Code (Blueprint)
# Qualifies for: "Best Use of Render" ($200 Prize Category)
# ═══════════════════════════════════════════════════════════

services:
  # 1. Backend API Service
  - type: web
    name: crisislens-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DEMO_MODE
        value: "true"
      - key: AI_PROVIDER
        value: demo
      - key: MONGODB_URI
        sync: false

  # 2. Frontend React Client (Static Site)
  - type: web
    name: crisislens-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: crisislens-api
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
