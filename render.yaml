# ═══════════════════════════════════════════════════════════
# CrisisLens — Render Infrastructure as Code (Blueprint)
# Qualifies for: "Best Use of Render" ($200 Prize Category)
# ═══════════════════════════════════════════════════════════

services:
  # 1. Backend API Service
  - type: web
    name: crisislens-api
    env: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DEMO_MODE
        value: "true"
      - key: AI_PROVIDER
        value: demo # or openrouter / groq for Gemma 2
      - key: MONGODB_URI
        sync: false # Set in Render dashboard for Atlas cloud persistence
      - key: CLIENT_URL
        value: https://crisislens.onrender.com

  # 2. Frontend React Client (Static Site)
  - type: web
    name: crisislens-client
    env: static
    plan: free
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
